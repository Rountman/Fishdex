name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      # prebuild runs scripts/build-data.ts (data/ + images/ -> src/data, public/fish)
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # the API only accepts known fish ids; its committed lists must match the data
      - name: Fish lists for the worker are up to date
        working-directory: .
        run: git diff --exit-code worker/src/backyard.json worker/src/fish.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # Chovatelé API (Cloudflare Worker + D1). Skipped until the Cloudflare secrets exist.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Tests and types
        run: npm test && npm run typecheck

      - name: Database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply fishdex --remote

      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
