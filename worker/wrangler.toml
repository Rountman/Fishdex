name = "fishdex-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Discord application (public id; the secret is set with `wrangler secret put DISCORD_CLIENT_SECRET`)
DISCORD_CLIENT_ID = "1572926626805584002"
# admins of the Chovatelé register (Discord user ids, comma-separated)
ADMIN_IDS = "428601328571514900"
# where the web app runs: CORS and allowed login return URLs
ALLOWED_ORIGINS = "https://rountman.github.io,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "fishdex"
database_id = "7d6603fa-c031-4a1f-b7f2-c09447db1caf"
migrations_dir = "migrations"
